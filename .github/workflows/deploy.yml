name: Deploy Migration to Hostinger

on:
  push:
    branches:
      - master

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Run Migration
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              -p 65002 \
              -o StrictHostKeyChecking=no \
              u123456789@46.202.186.143 \
              "cd ~/domains/agrp.my.id/public_html/fm && php artisan migrate --force"
